[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-prediction"
version = "2.0.0"
description = "End-to-end stroke risk prediction: pipeline, models, and a Flask serving app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["machine-learning", "healthcare", "logistic-regression", "flask"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn==1.3.2",
    "joblib>=1.3",
    "imbalanced-learn>=0.11",
    "Flask>=3.0",
    "flask-cors>=4.0",
]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.7", "seaborn>=0.12", "pyarrow>=14.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
